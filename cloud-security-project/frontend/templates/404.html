<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found - Cloud Security Analytics</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
</head>
<body data-theme="dark" style="min-height:100vh; background: radial-gradient(circle at top, rgba(0,229,255,0.16), transparent 32%), linear-gradient(180deg, #020617 0%, #0F172A 100%);">
  <main class="container d-flex align-items-center justify-content-center" style="min-height:100vh;">
    <div class="glass-card text-center p-5" style="max-width:720px; width:100%;">
      <div class="badge-status mb-3" style="background: rgba(0,229,255,0.12); color: var(--accent);">SOC ERROR</div>
      <div style="font-size:4rem; font-weight:800; color: var(--accent); line-height:1;">404</div>
      <h1 class="mt-3 mb-2">Page Not Found</h1>
      <p style="color: var(--text-muted);" class="mb-4">The resource you requested is not available in the SOC console.</p>
      <a href="{{ url_for('dashboard') }}" class="btn btn-cyan"><i class="bi bi-arrow-left me-1"></i> Back to Dashboard</a>
    </div>
  </main>
</body>
</html>
